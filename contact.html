<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="Élan Fitness, salle de sport à Casablanca : musculation, yoga, cardio et boxe fitness avec des coachs diplômés. Réservez votre cours d'essai gratuit.">
    <title>Contact - Élan Fitness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="en-tete">
        <div class="conteneur en-tete-contenu">
            <a href="index.html" class="logo">
               <img src="img/logo1.png"alt="logo de la salle de sport elan fitness"></a>

            <nav aria-label="Navigation principale">
                <ul class="menu">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="a-propos.html">À propos</a></li>
                    <li><a href="programmes.html">Programmes</a></li>
                    <li><a href="contact.html" class="lien-actif">Contactez-nous</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="bag">
        <div class="cen">

            <section class="contact">
                <h1>CONTACTEZ-NOUS</h1>

                <form>
                    <div class="ligne">
                        <label for="nom">Nom :</label>
                        <input type="text" id="nom" placeholder="Nom">
                        <label for="prenom">Prénom:</label>
                        <input type="text" id="prenom" placeholder="Prénom">
                    </div>

                    <div class="ligne">
                        <label for="tel">N°phone :</label>
                        <input type="tel" id="tel" placeholder="N° de téléphone">
                    </div>

                    <div class="ligne">
                        <label for="email">Email :</label>
                        <input type="email" id="email" placeholder="Email">
                    </div>

                    <div class="ligne ligne-message">
                        <label for="message">Message :</label>
                        <textarea id="message" placeholder="Message"></textarea>
                    </div>

                    <button type="submit">Envoyer</button>
                </form>


            </section>

        </div>
    </main>
    <footer class="pied-de-page">
        <div class="conteneur">

            <div class="pied-haut">
                <div>
                    <p class="logo logo-clair">Élan Fitness</p>
                    <p class="slogan">Ton énergie, ton rythme.</p>
                </div>

                <nav aria-label="Navigation du pied de page">
                    <ul class="menu menu-pied">
                        <li><a href="index.html">Accueil</a></li>
                        <li><a href="a-propos.html">À propos</a></li>
                        <li><a href="programmes.html">Programmes</a></li>
                        <li><a href="contact.html">Contactez-nous</a></li>

                    </ul>
                </nav>
            </div>

            <div class="pied-bas">
                <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
                <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
            </div>

        </div>
    </footer>
</body>

</html>
